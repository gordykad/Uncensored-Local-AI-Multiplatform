workflows:
  ios-testflight:
    name: iOS TestFlight (from-source Flutter build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.41.6
      xcode: latest
      groups:
        - export-fetch
      vars:
        BUNDLE_ID: "com.seven.portableai"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Show toolchain versions
        script: |
          flutter --version
          dart --version
      - name: Enable Swift Package Manager (llamadart 0.17.x companion is SPM-only)
        script: flutter config --enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          cd ios && xcode-project use-profiles
      - name: Build Flutter iOS (no codesign; signing happens at archive)
        script: flutter build ios --release --no-codesign
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Patch llamadart framework minimum OS (ITMS-90208)
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          IPA_ABS="$PWD/$IPA"
          echo "Patching $IPA_ABS"
          WORK=$(mktemp -d)
          unzip -q "$IPA_ABS" -d "$WORK"
          APP="$WORK/Payload/Runner.app"
          echo "App MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "Frameworks in IPA:"
          ls "$APP/Frameworks"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
          echo "Signing identity: $IDENTITY"
          test -n "$IDENTITY"
          codesign -d --entitlements :- "$APP" > "$WORK/ent.plist"
          for FW in "$APP/Frameworks/"*.framework; do
            [ -d "$FW" ] || continue
            PLIST="$FW/Info.plist"
            if /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST" >/dev/null 2>&1; then
              CUR=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")
              echo "$(basename "$FW") MinimumOSVersion: $CUR"
              if [ "$CUR" != "16.4" ]; then
                /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 16.4" "$PLIST"
                echo "$(basename "$FW") patched to 16.4; re-signing"
                codesign -f -s "$IDENTITY" "$FW"
              fi
            else
              echo "$(basename "$FW") has no MinimumOSVersion key; skipped"
            fi
          done
          codesign -f -s "$IDENTITY" --entitlements "$WORK/ent.plist" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -f "$IPA_ABS"
          (cd "$WORK" && zip -qry "$IPA_ABS" Payload)
          ls -la "$IPA_ABS"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
