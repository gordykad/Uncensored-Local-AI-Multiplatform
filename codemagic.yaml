workflows:
  ios-testflight:
    name: iOS TestFlight (from-source Flutter build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.41.6
      xcode: latest
      groups:
        - export-fetch
      vars:
        BUNDLE_ID: "com.seven.portableai"
        XCODE_PROJECT: "ios/Runner.xcodeproj"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Show toolchain versions
        script: |
          flutter --version
          dart --version
      - name: Get Flutter packages
        script: flutter pub get
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          cd ios && xcode-project use-profiles
      - name: Build Flutter iOS (no codesign; signing happens at archive)
        script: flutter build ios --release --no-codesign
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
